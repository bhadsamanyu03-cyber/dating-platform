[project]
name = "dating-platform-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "psycopg[binary]>=3.2,<4", "redis>=5.2,<6", "celery>=5.4,<6", "python-json-logger>=3.2,<4", "prometheus-client>=0.21,<1", "alembic>=1.14,<2", "PyJWT[crypto]>=2.10,<3", "argon2-cffi>=23.1,<24", "email-validator>=2.2,<3", "python-multipart>=0.0.20,<1", "Pillow>=11,<12"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1", "ruff>=0.9,<1", "black>=24.10,<26"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py313"
[tool.black]
line-length = 100
