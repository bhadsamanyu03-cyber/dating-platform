name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: dating_platform_test, POSTGRES_USER: dating_platform, POSTGRES_PASSWORD: test-password}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dating_platform -d dating_platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://dating_platform:test-password@localhost:5432/dating_platform_test
      REDIS_URL: redis://localhost:6379/0
      BACKEND_CORS_ORIGINS: '["http://localhost:8081"]'
      TRUSTED_HOSTS: '["testserver","localhost"]'
      JWT_SECRET_KEY: ci-only-signing-key-that-is-long-and-not-a-production-secret
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: test-bucket
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      RUN_INTEGRATION_TESTS: "true"
    defaults: {run: {working-directory: apps/backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: ruff check . && black --check .
      - run: pytest
      - run: docker build -t dating-platform-backend .
  mobile:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json}
      - run: npm ci
      - run: npm run lint && npm test -- --watchAll=false
